[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seatflow"
version = "0.1.0"
description = "Native Linux desktop application for train booking profile management"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.0.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
seatflow = "seatflow.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["seatflow*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"
